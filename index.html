<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAOSUA | Sale Out Dashboard</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#dce3ee;--text:#182230;--muted:#68778a;--gold:#d88b00;--blue:#2878d4;--red:#e05d5d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.08em}.h1{font-size:30px;font-weight:800;margin:4px 0}.muted{color:var(--muted)}.filters,.grid{display:grid;gap:14px}.filters{grid-template-columns:repeat(4,1fr);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 5px 20px #26364d12}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}select{width:100%;background:#fff;border:1px solid #bfcbd9;border-radius:8px;color:var(--text);padding:10px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi b{display:block;font-size:25px;color:var(--gold);margin-top:4px}.grid{grid-template-columns:1.3fr 1fr}.wide{grid-column:1/-1}.chart{width:100%;height:360px}.legend{display:flex;gap:18px;margin:0 0 8px 42px;color:var(--muted)}.legend i{display:inline-block;width:12px;height:3px;vertical-align:middle;margin-right:5px}.checks{display:flex;flex-wrap:wrap;gap:10px 14px}.checks label{display:inline-flex;align-items:center;gap:4px;margin:0;color:var(--text);font-size:13px}.checks input{accent-color:var(--blue)}.bar{display:flex;align-items:center;gap:10px;margin:11px 0}.bar span:first-child{width:125px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:12px;background:#edf1f6;border-radius:8px;flex:1}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:8px}.num{width:115px;text-align:right;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}@media(max-width:800px){.filters,.kpis,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.head{display:block}.chart{height:300px}}
</style></head>
<body><main class="wrap">
<header class="head"><div><div class="eyebrow">CHAOSUA</div><div class="h1">Sale Out Dashboard</div><div class="muted">Qty / Sale Out Value · <span id="generated"></span></div></div><div class="muted">Makro: Qty EA × RSP</div></header>
<section class="filters card"><div class="channel-filter"><label>Channel</label><div id="channels"></div></div><div><label>From</label><select id="from"></select></div><div><label>To</label><select id="to"></select></div><div><label>Year</label><select id="year"><option>All</option></select></div></section>
<section class="kpis"><div class="card kpi"><span class="muted">Sale Out</span><b id="value">-</b><span class="muted">ล้านบาท</span></div><div class="card kpi"><span class="muted">Qty</span><b id="qty">-</b><span class="muted">EA</span></div><div class="card kpi"><span class="muted">เดือนข้อมูล</span><b id="months">-</b></div><div class="card kpi"><span class="muted">Records</span><b id="records">-</b></div></section>
<section class="grid"><div class="card wide"><h2>ยอดขายรายเดือน</h2><div class="muted">ปีล่าสุดเทียบปีก่อน · Jan–Dec</div><div class="legend"><span><i style="background:var(--blue)"></i><b id="latestLabel">Latest</b></span><span><i style="background:var(--red)"></i><b id="priorLabel">Prior</b></span></div><div id="monthly" class="chart"></div></div>
<div class="card"><h2>แยก Category</h2><div id="categories"></div></div><div class="card"><h2>Lotus's Store Format</h2><div id="formats"></div></div>
<div class="card wide"><h2>รายละเอียดรายเดือน</h2><table><thead><tr><th>Channel / เดือน</th><th>Category</th><th>Store Format</th><th>Qty EA</th><th>Sale Out บาท</th></tr></thead><tbody id="table"></tbody></table></div></section>
</main><script>
const $=id=>document.getElementById(id),months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let D=[],activeCat='All';
const fmtNum=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:0}).format(n||0),mb=n=>(n/1e6).toFixed(2);
function opts(id,vals){$(id).innerHTML='<option>All</option>'+[...new Set(vals)].filter(Boolean).sort().map(x=>`<option>${x}</option>`).join('')}
function filtered(){let chans=[...document.querySelectorAll('#channels input:checked')].map(x=>x.value),fy=$('year').value,from=+$('from').value,to=+$('to').value;return D.filter(r=>chans.includes(r.channel)&& (fy==='All'||String(r.year)===fy) && (+String(r.month).slice(5,7)>=from&&+String(r.month).slice(5,7)<=to) && (activeCat==='All'||r.category===activeCat))}
function bars(el,map){let a=Object.entries(map).sort((a,b)=>b[1]-a[1]),max=a[0]?.[1]||1;$(el).innerHTML=(el==='categories'?'<button onclick="activeCat=\'All\';render()">All Category</button>':'')+a.slice(0,12).map(([k,v])=>`<div class="bar" data-cat="${k}" style="cursor:pointer"><span title="${k}">${k}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><div class="num">${mb(v)} MB</div></div>`).join('')||'<span class="muted">ไม่มีข้อมูล</span>';if(el==='categories')$(el).querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{activeCat=x.dataset.cat;render()})}
function lineChart(rows){let years=[...new Set(rows.map(r=>Number(r.year)))].sort((a,b)=>b-a),latest=years[0],prior=years[1];if(!latest){$('monthly').innerHTML='ไม่มีข้อมูล';return}let vals=y=>months.map((_,i)=>rows.filter(r=>Number(r.year)===y&&Number(String(r.month).slice(5,7))===i+1).reduce((a,r)=>a+r.sale_value,0)),a=vals(latest),b=prior?vals(prior):months.map(()=>0),max=Math.max(...a,...b,1),W=900,H=300,L=48,R=18,T=18,B=38,iw=W-L-R,ih=H-T-B;const pts=v=>v.map((x,i)=>`${L+i*iw/11},${T+ih-(x/max)*ih}`).join(' ');const grid=[0,.25,.5,.75,1].map(p=>{let y=T+ih-p*ih;return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#e4e9f0"/><text x="${L-8}" y="${y+4}" text-anchor="end" fill="#68778a" font-size="11">${mb(max*p)}</text>`}).join('');const labels=months.map((m,i)=>`<text x="${L+i*iw/11}" y="${H-10}" text-anchor="middle" fill="#68778a" font-size="11">${m}</text>`).join('');$('latestLabel').textContent=latest;$('priorLabel').textContent=prior||'ไม่มีปีก่อน';$('monthly').innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Monthly sales comparison">${grid}${labels}<polyline points="${pts(a)}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${prior?`<polyline points="${pts(b)}" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:''}${a.map((x,i)=>`<circle cx="${L+i*iw/11}" cy="${T+ih-(x/max)*ih}" r="3.5" fill="var(--blue)"/>`).join('')}${prior?b.map((x,i)=>`<circle cx="${L+i*iw/11}" cy="${T+ih-(x/max)*ih}" r="3.5" fill="var(--red)"/>`).join(''):''}</svg>`}
function render(){let f=filtered(),val=f.reduce((a,r)=>a+r.sale_value,0),qty=f.reduce((a,r)=>a+r.qty,0);$('value').textContent=mb(val);$('qty').textContent=fmtNum(qty);$('months').textContent=new Set(f.map(r=>r.month)).size;$('records').textContent=fmtNum(f.length);lineChart(f);let c={};f.forEach(r=>c[r.category]=(c[r.category]||0)+r.sale_value);bars('categories',c);let s={};f.filter(r=>r.channel==='Lotus').forEach(r=>s[r.store_format]=(s[r.store_format]||0)+r.sale_value);bars('formats',s);$('table').innerHTML=f.slice().sort((a,b)=>b.sale_value-a.sale_value).slice(0,100).map(r=>`<tr><td>${r.channel} · ${r.month}</td><td>${r.category}</td><td>${r.store_format}</td><td>${fmtNum(r.qty)}</td><td>${fmtNum(r.sale_value)}</td></tr>`).join('')}
fetch('data.json').then(r=>r.json()).then(x=>{D=x.monthly;$('generated').textContent='สร้าง '+x.meta.generated_at;let channels=x.channels;let ch='<div class="checks"><label><input type="checkbox" id="allCh"> All Channel</label>'+channels.map(v=>`<label><input type="checkbox" value="${v}" checked> ${v}</label>`).join('')+'</div>';$('channels').innerHTML=ch;let years=[...new Set(D.map(r=>r.year))].sort((a,b)=>b-a);opts('year',years);$('year').value='All';['from','to'].forEach(id=>$(id).innerHTML=months.map((m,i)=>`<option value="${i+1}">${m}</option>`).join(''));$('from').value=1;$('to').value=12;$('allCh').onchange=()=>{document.querySelectorAll('#channels input:not(#allCh)').forEach(c=>c.checked=$('allCh').checked);render()};document.querySelectorAll('#channels input:not(#allCh)').forEach(c=>c.onchange=()=>{let all=[...document.querySelectorAll('#channels input:not(#allCh)')];$('allCh').checked=all.every(x=>x.checked);render()});['year','from','to'].forEach(id=>$(id).onchange=render);render()});
</script></body></html>
