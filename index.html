<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHAOSUA | Sale Out Dashboard</title><style>:root{--bg:#07111f;--card:#0d1b2e;--line:#203653;--text:#eaf2fb;--muted:#91a6bc;--gold:#f5b942;--blue:#4da3ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#07111f,#0b1728);color:var(--text);font:14px system-ui,Segoe UI,sans-serif}.wrap{max-width:1400px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.08em}.h1{font-size:30px;font-weight:800;margin:4px 0}.muted{color:var(--muted)}.filters,.grid{display:grid;gap:14px}.filters{grid-template-columns:repeat(4,1fr);margin-bottom:18px}.card{background:rgba(13,27,46,.94);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 30px #0003}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}select{width:100%;background:#101f34;border:1px solid #315071;border-radius:8px;color:var(--text);padding:10px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi b{display:block;font-size:25px;color:var(--gold);margin-top:4px}.grid{grid-template-columns:1.3fr 1fr}.wide{grid-column:1/-1}.bar{display:flex;align-items:center;gap:10px;margin:11px 0}.bar span:first-child{width:125px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:12px;background:#172b45;border-radius:8px;flex:1}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:8px}.num{width:115px;text-align:right;color:#d8e7f7}.row{display:flex;justify-content:space-between;border-bottom:1px solid #1a2e46;padding:9px 0}.row:last-child{border:0}.tag{color:var(--blue)}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:10px;border-bottom:1px solid #1a2e46}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}@media(max-width:800px){.filters,.kpis,.grid{grid-template-columns:1fr}.wide{grid-column:auto}.head{display:block}.bar span:first-child{width:95px}.num{width:95px}}
</style></head><body><main class="wrap"><header class="head"><div><div class="eyebrow">CHAOSUA</div><div class="h1">Sale Out Dashboard</div><div class="muted">Qty / Sale Out Value · Monthly view · <span id="generated"></span></div></div><div class="muted">Makro: Qty EA × RSP</div></header><section class="filters card"><div><label>Channel</label><select id="channel"><option>All</option></select></div><div><label>Year</label><select id="year"><option>All</option></select></div><div><label>Category</label><select id="cat"><option>All</option></select></div><div><label>Lotus's Store Format</label><select id="fmt"><option>All</option></select></div></section><section class="kpis"><div class="card kpi"><span class="muted">Sale Out</span><b id="value">-</b><span class="muted">ล้านบาท</span></div><div class="card kpi"><span class="muted">Qty</span><b id="qty">-</b><span class="muted">EA</span></div><div class="card kpi"><span class="muted">เดือนข้อมูล</span><b id="months">-</b></div><div class="card kpi"><span class="muted">Records</span><b id="records">-</b></div></section><section class="grid"><div class="card wide"><h2>ยอดขายรายเดือน</h2><div id="monthly"></div></div><div class="card"><h2>แยก Category</h2><div id="categories"></div></div><div class="card"><h2>Lotus's Store Format</h2><div id="formats"></div></div><div class="card wide"><h2>รายละเอียดรายเดือน</h2><table><thead><tr><th>Channel / เดือน</th><th>Category</th><th>Store Format</th><th>Qty EA</th><th>Sale Out บาท</th></tr></thead><tbody id="table"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let D=[];const fmtNum=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:0}).format(n||0),mb=n=>(n/1e6).toFixed(2);function opts(id,vals){$(id).innerHTML='<option>All</option>'+[...new Set(vals)].filter(Boolean).sort().map(x=>`<option>${x}</option>`).join('')}function filtered(){return D.filter(r=>( $('channel').value==='All'||r.channel===$('channel').value)&&( $('year').value==='All'||String(r.year)===$('year').value)&&( $('cat').value==='All'||r.category===$('cat').value)&&( $('fmt').value==='All'||r.store_format===$('fmt').value))}function bars(el,map){let a=Object.entries(map).sort((a,b)=>b[1]-a[1]),max=a[0]?.[1]||1;$(el).innerHTML=a.slice(0,12).map(([k,v])=>`<div class="bar"><span title="${k}">${k}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><div class="num">${mb(v)} MB</div></div>`).join('')||'<span class="muted">ไม่มีข้อมูล</span>'}function render(){let f=filtered(),val=f.reduce((a,r)=>a+r.sale_value,0),qty=f.reduce((a,r)=>a+r.qty,0);$('value').textContent=mb(val);$('qty').textContent=fmtNum(qty);$('months').textContent=new Set(f.map(r=>r.month)).size;$('records').textContent=fmtNum(f.length);let m={};f.forEach(r=>m[r.month]=(m[r.month]||0)+r.sale_value);bars('monthly',m);let c={};f.forEach(r=>c[r.category]=(c[r.category]||0)+r.sale_value);bars('categories',c);let s={};f.filter(r=>r.channel==='Lotus').forEach(r=>s[r.store_format]=(s[r.store_format]||0)+r.sale_value);bars('formats',s);$('table').innerHTML=f.slice().sort((a,b)=>b.sale_value-a.sale_value).slice(0,100).map(r=>`<tr><td>${r.channel} · ${r.month}</td><td>${r.category}</td><td>${r.store_format}</td><td>${fmtNum(r.qty)}</td><td>${fmtNum(r.sale_value)}</td></tr>`).join('')}fetch('data.json').then(r=>r.json()).then(x=>{D=x.monthly;$('generated').textContent='สร้าง '+x.meta.generated_at;opts('channel',x.channels);opts('year',D.map(r=>r.year));opts('cat',x.categories);opts('fmt',x.formats);['channel','year','cat','fmt'].forEach(id=>$(id).onchange=render);render()});</script></body></html>
